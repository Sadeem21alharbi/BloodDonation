{% extends 'main/base.html' %}

{% block content %}
<style>
    :root {
        --primary-gradient: linear-gradient(135deg, #1a56db 0%, #3f83f8 100%);
        --accent-red: #ef4444;
        --glass-bg: rgba(255, 255, 255, 0.9);
    }

    body {
        background: #f3f4f6;
        font-family: 'Tajawal', sans-serif;
    }

    .register-wrapper {
        min-height: 90vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
        direction: rtl;
    }

    .register-card {
        background: white;
        width: 100%;
        max-width: 550px;
        padding: 40px;
        border-radius: 25px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
        border: 1px solid #e5e7eb;
    }

    .register-header {
        text-align: center;
        margin-bottom: 30px;
    }

    .register-header i {
        font-size: 2.5rem;
        color: var(--accent-red);
        margin-bottom: 15px;
    }

    .register-header h2 {
        color: #1f2937;
        font-weight: 800;
        margin-bottom: 5px;
    }

    form p {
        margin-bottom: 20px;
    }

    form label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: #4b5563;
        font-size: 0.9rem;
    }

    input[type="text"], 
    input[type="password"], 
    input[type="email"],
    input[type="number"],
    select {
        width: 100%;
        padding: 12px 15px;
        border: 1.5px solid #e5e7eb;
        border-radius: 12px;
        font-family: 'Tajawal', sans-serif;
        background: #f9fafb;
        transition: all 0.3s ease;
    }

    input:focus {
        outline: none;
        border-color: #3f83f8;
        background: white;
        box-shadow: 0 0 0 4px rgba(63, 131, 248, 0.1);
    }

    .helptext {
        display: block;
        font-size: 0.8rem;
        color: #9ca3af;
        margin-top: 5px;
    }

    .btn-register {
        background: var(--primary-gradient);
        color: white;
        border: none;
        width: 100%;
        padding: 15px;
        border-radius: 12px;
        font-size: 1.1rem;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.2s ease;
        margin-top: 10px;
    }

    .btn-register:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(26, 86, 219, 0.2);
    }

    .register-footer {
        text-align: center;
        margin-top: 25px;
        padding-top: 20px;
        border-top: 1px solid #f3f4f6;
    }

    .register-footer a {
        color: #1a56db;
        text-decoration: none;
        font-weight: 700;
    }

    /* رسائل الخطأ */
    .errorlist {
        color: var(--accent-red);
        font-size: 0.85rem;
        padding: 0;
        list-style: none;
        margin-bottom: 10px;
    }
</style>

<div class="register-wrapper">
    <div class="register-card">
        <div class="register-header">
            <i class="fas fa-user-plus"></i>
            <h2>انضم لأبطال إحياء</h2>
            <p class="text-muted">خطوة بسيطة منك.. حياة جديدة لغيرك</p>
            </div>
            
            <form method="POST">
                {% csrf_token %}
            
                {% if form.errors %}
                <div class="alert alert-danger" style="border-radius: 12px; font-size: 0.9rem;">
                    يرجى تصحيح الأخطاء أدناه للمتابعة.
                </div>
                {% endif %}
            
                {{ form.as_p }}
            
                <button type="submit" class="btn-register w-100 border-0">
                    إنشاء حساب جديد <i class="fas fa-user-plus ms-2"></i>
                </button>
            
            </form>
            
            <div class="register-footer">
                <p>لديك حساب بالفعل؟ <a href="{% url 'donor:login' %}">سجل دخولك هنا</a></p>
            </div>
            </div>
            </div>
            {% endblock %}
