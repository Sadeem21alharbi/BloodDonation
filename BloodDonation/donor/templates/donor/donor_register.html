{% extends 'main/base.html' %}

{% block content %}
<style>
    :root {
        --primary-blue: #1a56db;
        --secondary-blue: #3f83f8;
        --accent-red: #ef4444;
        --text-dark: #1f2937;
        --bg-light: #f9fafb;
    }

    body {
        background-color: var(--bg-light);
        font-family: 'Tajawal', sans-serif;
    }

    .register-wrapper {
        min-height: 90vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 30px 20px;
        direction: rtl;
    }

    .register-card {
        background: white;
        width: 100%;
        /* تم تصغير الحجم هنا ليكون أكثر أناقة وتوازناً */
        max-width: 650px; 
        padding: 50px 40px;
        border-radius: 24px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.03);
        border: 1px solid #f0f0f0;
    }

    .register-header {
        text-align: center;
        margin-bottom: 35px;
    }

    .register-header h2 {
        color: var(--text-dark);
        font-weight: 800;
        font-size: 1.8rem; /* تصغير حجم الخط قليلاً ليتناسب مع الكرت */
        margin-bottom: 10px;
    }

    .register-header p {
        color: #6b7280;
        font-size: 1rem;
    }

    .auth-form {
        width: 100%;
    }

    .auth-form p {
        margin-bottom: 18px;
    }

    .auth-form label {
        display: block;
        margin-bottom: 8px;
        font-weight: 700;
        color: var(--text-dark);
        font-size: 0.9rem;
        text-align: right;
    }

    .auth-form input, .auth-form select {
        width: 100%;
        padding: 12px 18px;
        border: 1.5px solid #edf2f7;
        border-radius: 12px;
        font-family: 'Tajawal', sans-serif;
        background: #fcfcfc;
        font-size: 0.95rem;
        transition: all 0.3s ease;
        text-align: right;
    }

    .auth-form input:focus {
        outline: none;
        border-color: var(--secondary-blue);
        background: white;
        box-shadow: 0 0 0 4px rgba(63, 131, 248, 0.05);
    }

    .helptext {
        display: block;
        font-size: 0.8rem;
        color: #9ca3af;
        margin-top: 5px;
        line-height: 1.4;
    }

    .btn-register {
        background: var(--primary-blue);
        color: white;
        border: none;
        width: 100%;
        padding: 14px;
        border-radius: 12px;
        font-size: 1.1rem;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-top: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
    }

    .btn-register:hover {
        background: #1e429f;
        transform: translateY(-1px);
    }

    .register-footer {
        text-align: center;
        margin-top: 30px;
        padding-top: 25px;
        border-top: 1px solid #f3f4f6;
    }

    .register-footer p {
        color: #6b7280;
        font-size: 0.95rem;
    }

    .logo-icon {
        color: var(--accent-red);
        font-size: 2.2rem;
        margin-bottom: 15px;
        display: block;
    }

    .errorlist {
        list-style: none;
        padding: 0;
        color: var(--accent-red);
        font-size: 0.85rem;
    }
</style>

<div class="register-wrapper">
    <div class="register-card">
        <div class="register-header">
            <i class="fas fa-user-plus logo-icon"></i>
            <h2>انضم لأبطال إحياء</h2>
            <p>خطوة بسيطة منك.. حياة جديدة لغيرك</p>
        </div>

        <div class="auth-form">
            <form method="POST">
                {% csrf_token %}
            
                {% if form.errors %}
                <div class="alert alert-danger text-center mb-4" style="border-radius: 12px; padding: 10px; font-size: 0.9rem;">
                    يرجى مراجعة البيانات المدخلة
                </div>
                {% endif %}
            
                {{ form.as_p }}
            
                <button type="submit" class="btn-register">
                    إنشاء حساب جديد <i class="fas fa-user-plus"></i>
                </button>
            </form><div class="register-footer">
                <p>لديك حساب بالفعل؟ <a href="{% url 'donor:login' %}" style="color: var(--primary-blue); font-weight: 800; text-decoration: none;">سجل دخولك هنا</a></p>
                <p class="mt-2"><a href="/" class="text-muted small">العودة للرئيسية</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
