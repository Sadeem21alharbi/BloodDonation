{% extends 'donor/base_donor.html' %}
{% block content %}

<style>
    .auth-card {
        background: white;
        border-radius: 24px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.02);
        padding: 40px;
        max-width: 500px;
        margin: 50px auto;
        direction: rtl;
        animation: fadeIn 0.6s ease-out;
    }
    .btn-update {
        background: #1a56db;
        color: white;
        width: 100%;
        padding: 12px;
        border-radius: 12px;
        border: none;
        font-weight: 600;
        margin-top: 20px;
    }
    .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: #1e293b;
    }
    .form-group input {
        width: 100%;
        padding: 12px;
        border: 1px solid #e2e8f0;
        border-radius: 10px;
        margin-bottom: 15px;
    }
    .helptext {
        font-size: 0.8rem;
        color: #64748b;
        display: block;
        margin-bottom: 15px;
    }
</style>

<div class="container">
    <div class="auth-card text-right">
        <h3 class="fw-bold mb-4"><i class="fas fa-key ms-2 text-primary"></i>تغيير كلمة المرور</h3>
        
        <form method="POST">
            {% csrf_token %}
            {% for field in form %}
                <div class="form-group">
                    <label>{{ field.label }}</label>
                    {{ field }}
                    {% if field.help_text %}
                        <small class="helptext">{{ field.help_text|safe }}</small>
                    {% endif %}
                </div>
            {% endfor %}
            <button type="submit" class="btn-update shadow">تحديث كلمة المرور</button>
        </form>
        
        <div class="text-center mt-4">
            <a href="{% url 'donor:profile' %}" class="text-decoration-none text-muted">
                <i class="fas fa-arrow-right ms-1"></i> العودة للملف الشخصي
            </a>
        </div>
    </div>
</div>

{% endblock %}
